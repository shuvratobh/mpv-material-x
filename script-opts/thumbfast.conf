# Excessively exaggerated/zoomed in thumbnails
# 0 for unset
max_height=200
max_width=200

# Use mpv to generate thumbnails (more compatible, but slower)
mpv_path=mpv

# Socket path for the thumbnailer
# On Windows: \\.\pipe\thumbfast
# On Linux/macOS: /tmp/thumbfast
socket=

# Overlay id
overlay_id=42

# Spawn thumbnailer on file load
spawn_first=yes

# Enable on network streams
network=yes

# Audio file thumbnails
audio=yes

# Hardware decoder
hwdec=yes

# Direct mode (use VO to draw)
direct_io=yes
