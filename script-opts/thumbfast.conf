# Excessively exaggerated/zoomed in thumbnails
# 0 for unset
max_height=200
max_width=200

# Minimum time between thumbnail generation (in seconds)
# Increase to reduce CPU usage
min_interval=0.1

# Try to get the thumbnail faster at the expense of quality
# (requires mpv to be built with zimg support)
precise=yes

# Use mpv to generate thumbnails (more compatible, but slower)
mpv_path=mpv

# Socket path for the thumbnailer
# On Windows: \\.\pipe\thumbfast
# On Linux/macOS: /tmp/thumbfast
socket=

# Overlay id
overlay_id=42

# Spawn thumbnailer on file load
spawn_first=yes

# Close thumbnailer when file is unloaded
quit_after_last_file=no

# Enable on network streams
network=yes

# Audio file thumbnails
audio=yes

# Hardware decoder
hwdec=yes

# Direct mode (use VO to draw)
direct_io=yes
