# mpvshot â€” configuration
#
# Copy to <mpv config>\script-opts\mpvshot.conf
#   Windows portable : <mpv folder>\portable_config\script-opts\
#   Windows          : %APPDATA%\mpv\script-opts\
#   Linux / macOS    : ~/.config/mpv/script-opts/
#
# Standard mpv script-opts format: key=value, no quoting, # for comments.
# Anything here can also be set per run: --script-opts=mpvshot-telegram=yes
#
# Without this file mpvshot is a screenshot organiser and nothing else: it
# saves into TV\ / Movies\ / Clips\ / Unsorted\ and uploads nothing.

# --- Telegram ---------------------------------------------------------------
# The master switch. Uploading stays off until this is yes and a token and
# chat id are set below.
telegram=no

# From @BotFather.
#bot_token=123456:ABC...

# Forum supergroup id, including the -100 prefix.
#chat_id=-1001234567890

# Topic (message thread) ids. See the README for how to find these.
# Leave unset (or set to 1, the General topic's id) to post into General:
# the Bot API rejects message_thread_id=1, so General means sending no topic
# at all, and mpvshot does that for you.
#topic_photos=2
#topic_docs=3

# Category hashtag added after the title's own, e.g. "#Frieren... #TV".
# Set any of them empty to leave that category untagged.
tag_tv=TV
tag_movie=Movie
tag_clip=Clip
tag_other=Stream

# Compressed photo post, pixel-exact original as a document. Either can be off.
upload_photos=yes
upload_docs=yes

# --- Storage ----------------------------------------------------------------
# Archive root. Defaults to <home>\Pictures\mpv. Layout underneath:
# TV\, Movies\, Clips\, Unsorted\.
screenshot_root=X:\Screenshots

# Where failed uploads wait to be retried. Defaults to %APPDATA%\mpvshot\outbox
# on Windows, ~/.local/state/mpvshot/outbox elsewhere.
#outbox_dir=

# --- Behaviour --------------------------------------------------------------
# Seconds of quiet before the queue is posted, so rapid-fire shots become one
# album instead of one post each. 0 posts immediately.
debounce=2.5

# Quality of the upload-only JPEG, 0-100. The archived PNG is unaffected.
jpeg_quality=95

# Log captions and the curl argv (token redacted) instead of posting. Works
# without a token, and is the quickest way to check naming and captions.
dry_run=no

# Force software screenshots. Off leaves mpv's own screenshot-sw setting
# alone. Try yes if HDR screenshots come out washed out under vo=gpu-next.
screenshot_sw=no

