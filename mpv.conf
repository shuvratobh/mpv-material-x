# SCREENSHOT SETTINGS
screenshot-directory="X:/Screenshots"
screenshot-template="mpv-%f-%n"

# SHADERS (leave untouched as requested)
# glsl-shaders="~~/shaders/Anime4K_Clamp_Highlights.glsl;~~/shaders/Anime4K_Restore_CNN_M.glsl;~~/shaders/Anime4K_Upscale_CNN_x2_M.glsl;~~/shaders/Anime4K_AutoDownscalePre_x2.glsl;~~/shaders/Anime4K_AutoDownscalePre_x4.glsl;~~/shaders/Anime4K_Upscale_CNN_x2_S.glsl"

# VIDEO OUTPUT & RENDERING
vo=gpu
gpu-api=vulkan
hwdec=nvdec-copy

tone-mapping=spline
target-colorspace-hint=yes
dither-depth=auto
fullscreen=yes
border=no
osc=no
keep-open=yes
keep-open-pause=no
idle=yes
ytdl-raw-options=js-runtimes=node:C:\nvm4w\nodejs\node.exe,cookies=C:\Users\shuvr\AppData\Roaming\mpv\script-opts\cookies.txt,no-playlist=
ytdl-format=best[vcodec!=none][acodec!=none]/best
priority=high

# SUBTITLES
sub-font="Asap Condensed Medium"
sub-font-size=48
sub-color="#FFFFFFFF"
sub-border-color="#000000"
sub-border-size=2.0
sub-shadow-offset=1.5
sub-shadow-color="#00000090"
sub-margin-y=44
sub-auto=fuzzy



# HDR-SPECIFIC TONE MAPPING PROFILE
[HDR]
profile-cond=p["video-params/gamma"] == "pq"
profile-restore=copy
tone-mapping=spline
gamut-mapping-mode=auto
hdr-compute-peak=yes
target-trc=bt.1886
secondary-sid=2
